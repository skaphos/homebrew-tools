name: Tap CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Homebrew/actions publishes no release tags, so pin to a main commit.
      # Dependabot only bumps SHA pins that track a version tag, so it will not
      # refresh this one: update it by hand from Homebrew/actions main.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # main
        with:
          token: ${{ github.token }}

      - name: Validate tap contents
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          formulae=(Formula/*.rb)
          casks=(Casks/*.rb)

          if [ ${#formulae[@]} -eq 0 ] && [ ${#casks[@]} -eq 0 ]; then
            echo "No formulae or casks found. Skipping checks."
            exit 0
          fi

          brew update --quiet
          brew --version

          if [ ${#formulae[@]} -gt 0 ]; then
            echo "Running brew style for formulae..."
            brew style "${formulae[@]}"

            echo "Running brew audit for formulae..."
            brew audit --strict --online "${formulae[@]}"

            echo "Building formulae from source..."
            for formula in "${formulae[@]}"; do
              name="$(basename "$formula" .rb)"
              echo "Installing $name from $formula"
              brew install --build-from-source "$formula"
              brew uninstall --force "$name"
            done
          else
            echo "No formulae found in Formula/. Skipping formula checks."
          fi

          if [ ${#casks[@]} -gt 0 ]; then
            echo "Running brew style for casks..."
            brew style "${casks[@]}"

            echo "Running brew audit for casks..."
            brew audit --cask --strict --online "${casks[@]}"
          else
            echo "No casks found in Casks/. Skipping cask checks."
          fi
